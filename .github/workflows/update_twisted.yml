name: Update Twisted Services
on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly on Sunday
  workflow_dispatch:   # Allows manual trigger

jobs:
  update-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install dnstwist

      - name: Generate Twisted Lists
        run: python scripts/generate_twisted.py

      - name: Group Services
        run: python scripts/group_services.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add services/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of twisted services" && git push)
