name: Update Hardening Lists
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  update-hardening:
    # Default to a standard Linux self-hosted runner so private resolvers on the
    # home network remain reachable. Override with HARDENING_RUNNER_LABELS if you
    # want a stricter label match such as ["self-hosted","linux","x64"].
    runs-on: ${{ fromJSON(vars.HARDENING_RUNNER_LABELS || '["self-hosted","linux"]') }}
    env:
      DNSTWIST_NAMESERVERS: ${{ vars.DNSTWIST_NAMESERVERS }}
      DNSTWIST_THREADS: ${{ vars.DNSTWIST_THREADS }}
      VENV_PATH: .venv-hardening
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check local Python
        run: |
          python3 --version
          python3 -m pip --version
          python3 -m venv --help >/dev/null

      - name: Install Dependencies
        run: |
          python3 -m venv "$VENV_PATH"
          "$VENV_PATH/bin/python" -m pip install --upgrade pip
          "$VENV_PATH/bin/python" -m pip install dnstwist dnspython pytest

      - name: Generate Hardening Lists
        run: $VENV_PATH/bin/python scripts/generate_twisted.py

      - name: Run tests
        run: $VENV_PATH/bin/python -m pytest -q tests/test_generate_twisted.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git add hardening/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update hardening lists" && git push)
