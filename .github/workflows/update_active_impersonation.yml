name: Update Active Impersonation Review
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  update-active-impersonation:
    # Default to the same self-hosted runner family as the hardening job so the
    # review can probe through the same home-network resolver path when needed.
    runs-on: ${{ fromJSON(vars.ACTIVE_IMPERSONATION_RUNNER_LABELS || vars.HARDENING_RUNNER_LABELS || '["self-hosted","linux"]') }}
    env:
      ACTIVE_IMPERSONATION_MAX_CANDIDATES: ${{ vars.ACTIVE_IMPERSONATION_MAX_CANDIDATES }}
      ACTIVE_IMPERSONATION_MAX_RESPONSE_BYTES: ${{ vars.ACTIVE_IMPERSONATION_MAX_RESPONSE_BYTES }}
      ACTIVE_IMPERSONATION_MAX_WORKERS: ${{ vars.ACTIVE_IMPERSONATION_MAX_WORKERS || '10' }}
      ACTIVE_IMPERSONATION_TARGET_JOBS: ${{ vars.ACTIVE_IMPERSONATION_TARGET_JOBS || '2' }}
      ACTIVE_IMPERSONATION_CONNECT_TIMEOUT: ${{ vars.ACTIVE_IMPERSONATION_CONNECT_TIMEOUT }}
      ACTIVE_IMPERSONATION_READ_TIMEOUT: ${{ vars.ACTIVE_IMPERSONATION_READ_TIMEOUT }}
      ACTIVE_IMPERSONATION_TARGETS: ${{ vars.ACTIVE_IMPERSONATION_TARGETS }}
      VENV_PATH: .venv-active-impersonation
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check local Python
        run: |
          python3 --version
          python3 -m pip --version
          python3 -m venv --help >/dev/null

      - name: Install Dependencies
        run: |
          python3 -m venv "$VENV_PATH"
          "$VENV_PATH/bin/python" -m pip install --upgrade pip
          "$VENV_PATH/bin/python" -m pip install pytest requests

      - name: Generate Active Impersonation Review
        run: $VENV_PATH/bin/python scripts/generate_active_impersonation.py

      - name: Run tests
        run: $VENV_PATH/bin/python -m pytest -q tests/test_generate_active_impersonation.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git add hardening/active_impersonation/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update active impersonation review" && git push)
